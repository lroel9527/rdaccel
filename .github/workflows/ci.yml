name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavutil-dev libswscale-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxtst-dev xvfb zlib1g-dev
      - name: Build (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: X11 capture, display selection, cursor and input injection (Xvfb)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/bin/rdaccel_platform_tests \
            --gtest_filter='Platform*:CApi.ListDisplays*:CApi.Injector*' 2>&1 | tee x11.log
          if grep -q SKIPPED x11.log; then echo "X11 tests skipped under Xvfb"; exit 1; fi
      - name: Install, then build examples/minimal against the installed package
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cmake --install build --prefix "$PWD/inst"
          cmake -S examples/minimal -B build-minimal -DCMAKE_PREFIX_PATH="$PWD/inst" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined" -DCMAKE_C_FLAGS="-fsanitize=address,undefined"
          cmake --build build-minimal
          ./build-minimal/minimal
          ./build-minimal/minimal_c
      - name: Build the C example with pkg-config against the installed static library
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export PKG_CONFIG_PATH="$PWD/inst/lib/pkgconfig"
          pkg-config --modversion rdaccel
          cc -std=c99 -pedantic -fsanitize=address,undefined examples/minimal_c/main.c \
            $(pkg-config --static --cflags --libs rdaccel) -o minimal_c_pc
          ./minimal_c_pc
      - name: Shared library exports only the C ABI
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DRDACCEL_BUILD_TESTS=OFF -DRDACCEL_INSTALL_TOOLS=ON
          cmake --build build-shared -j4
          nm -D --defined-only build-shared/librdaccel.so | awk '{print $3}' | sort > exports.txt
          if grep -v '^rda_' exports.txt; then echo "unexpected exports"; exit 1; fi
          echo "$(wc -l < exports.txt) rda_* functions exported"
          ./build-shared/bin/rdaccel_minimal_c
      - name: Release package (cpack) works on its own
        run: |
          (cd build-shared && cpack)
          mkdir pkg && tar -xzf build-shared/rdaccel-*.tar.gz -C pkg --strip-components=1
          ./pkg/bin/rdaccel_serve 2>&1 | grep -q -- --key
          cc -std=c99 examples/minimal_c/main.c $(PKG_CONFIG_PATH="$PWD/pkg/lib/pkgconfig" pkg-config --cflags --libs rdaccel) \
            -Wl,-rpath,"$PWD/pkg/lib" -o minimal_c_shared
          ./minimal_c_shared
      - name: Record synthetic stream (x265)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ./build/bin/rdaccel_record --out=linux.rdstream --frames=120 --size=1280x720 --bitrate=3000000
      - uses: actions/upload-artifact@v4
        with:
          name: linux-stream
          path: linux.rdstream

  abi:
    # The C ABI against the PR's base: incompatible changes need a version bump.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y abigail-tools libavcodec-dev libavutil-dev libswscale-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxtst-dev zlib1g-dev
      - name: abidiff against the base branch
        run: |
          set -o pipefail
          tools/abi_check.sh ${{ github.event.pull_request.base.sha }} "$RUNNER_TEMP/abi" | tee abi.txt
          { echo '### C ABI'; echo '```'; cat abi.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev libavcodec-dev libavutil-dev libswscale-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxtst-dev zlib1g-dev
      - name: Build fuzzers (libFuzzer + ASan + UBSan)
        run: |
          F="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined"
          CC=clang CXX=clang++ cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRDACCEL_BUILD_FUZZERS=ON -DRDACCEL_BUILD_TESTS=OFF -DRDACCEL_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_FLAGS="$F" -DCMAKE_CXX_FLAGS="$F"
          cmake --build build-fuzz -j4
      - name: Fuzz each target for 60 s
        run: |
          mkdir -p crashes
          for t in messages lossless viewer link secure reliable hevc recording; do
            echo "::group::fuzz_$t"
            mkdir -p corpus/$t
            # Seeds checked into the repo (read only; new finds go to corpus/).
            seeds=""
            if [ -d fuzz/corpus/$t ]; then seeds=fuzz/corpus/$t; fi
            ./build-fuzz/fuzz/fuzz_$t corpus/$t $seeds -max_total_time=60 -rss_limit_mb=2048 -artifact_prefix=crashes/$t- -print_final_stats=1
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/

  macos:
    needs: linux
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j4
      - name: Core tests
        run: ./build/bin/rdaccel_tests
      - name: Install, then build examples/minimal against the installed package
        run: |
          cmake --install build --prefix "$PWD/inst"
          cmake -S examples/minimal -B build-minimal -DCMAKE_PREFIX_PATH="$PWD/inst"
          cmake --build build-minimal
      - name: Shared library exports only the C ABI
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DRDACCEL_BUILD_TESTS=OFF -DRDACCEL_INSTALL_TOOLS=ON
          cmake --build build-shared -j4
          nm -gU build-shared/librdaccel.dylib | awk '{print $3}' | sort > exports.txt
          if grep -v '^_rda_' exports.txt; then echo "unexpected exports"; exit 1; fi
          echo "$(wc -l < exports.txt) rda_* functions exported"
      - name: Release package (cpack) works on its own
        run: |
          (cd build-shared && cpack)
          mkdir pkg && tar -xzf build-shared/rdaccel-*.tar.gz -C pkg --strip-components=1
          ./pkg/bin/rdaccel_serve 2>&1 | grep -q -- --key
          cmake -S examples/minimal -B build-minimal-pkg -DCMAKE_PREFIX_PATH="$PWD/pkg"
          cmake --build build-minimal-pkg
      # Hosted macOS runners are VMs; the hardware HEVC encoder may be
      # missing there, so codec steps report but do not fail the build.
      - name: VideoToolbox codec + public API tests
        continue-on-error: true
        run: |
          ./build/bin/rdaccel_platform_tests
          ./build-minimal/minimal
          ./build-minimal/minimal_c
      - uses: actions/download-artifact@v4
        with:
          name: linux-stream
      - name: Decode the Linux stream with VideoToolbox (interop)
        continue-on-error: true
        run: ./build/bin/rdaccel_play linux.rdstream --check-synthetic
      - name: Record synthetic stream (VideoToolbox)
        id: record
        continue-on-error: true
        run: ./build/bin/rdaccel_record --out=mac.rdstream --frames=120 --size=1280x720 --bitrate=3000000
      - uses: actions/upload-artifact@v4
        if: steps.record.outcome == 'success'
        with:
          name: mac-stream
          path: mac.rdstream

  interop-linux-decodes-mac:
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: mac-stream
      - name: Install dependencies
        if: steps.dl.outcome == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavutil-dev libswscale-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxtst-dev
      - name: Decode the Mac stream with FFmpeg (interop)
        if: steps.dl.outcome == 'success'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRDACCEL_BUILD_TESTS=OFF
          cmake --build build -j4 --target rdaccel_play
          RDACCEL_DEBUG=1 ./build/bin/rdaccel_play mac.rdstream --check-synthetic
